# Tests every pull request and every push to main; publishes the site after the tests
# pass on main (.openspec/specs/000-site, Requirements 5 and 8)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target wasm32-unknown-unknown --component llvm-tools-preview
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game-core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,cargo-llvm-cov
      - run: npm ci
      - run: npm test
      - name: Build the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
